[package]
name = "vaultday-vault-base"
description = "Markdown vault parser, writer and workspace resolution for Vaultday"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "vault_base"

[dependencies]
# The billing maths (rounding, the billable flag, quote durations) shared with
# `features/toggl`, so a report and a Toggl entry bill the same.
domain = { package = "vaultday-domain", path = "../domain" }
globset = "0.4"
notify = "8.2.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
