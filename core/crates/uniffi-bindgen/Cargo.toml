[package]
name = "vaultday-uniffi-bindgen"
description = "The uniffi-bindgen-swift binary, built from the same uniffi version crates/ffi links against"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/main.rs"

[dependencies]
uniffi = { version = "=0.32.2", features = ["cli"] }

[lints]
workspace = true
