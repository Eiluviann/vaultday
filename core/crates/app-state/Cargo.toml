[package]
name = "vaultday-app-state"
description = "Vaultday's app state: the Automerge documents, their encrypted change files, the signed app snapshot and the key hierarchy behind them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "app_state"

[dependencies]
automerge = "0.12"
chacha20poly1305 = "0.10"
domain = { package = "vaultday-domain", path = "../domain" }
ed25519-dalek = "2"
getrandom = "0.3"
# Same features as `domain`: civil dates and timestamps, no zone database.
jiff = { version = "0.2", default-features = false, features = ["std"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
