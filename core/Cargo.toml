[workspace]
resolver = "3"
# Listed one by one: `crates/features` holds the feature-set crates, one
# folder each, and is no crate itself.
members = [
    "crates/app-state",
    "crates/domain",
    "crates/features/*",
    "crates/ffi",
    "crates/mail",
    "crates/node",
    "crates/uniffi-bindgen",
    "crates/vault-base",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
