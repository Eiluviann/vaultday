[workspace]
resolver = "3"
# Listed one by one: `crates/features` holds the feature-set crates, one
# folder each, and is no crate itself.
members = [
    "crates/app-state",
    "crates/close-out",
    "crates/domain",
    "crates/features/*",
    "crates/ffi",
    "crates/mail",
    "crates/node",
    "crates/uniffi-bindgen",
    "crates/vault-base",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

# Local builds and tests: line tables for the workspace crates, so panics and
# backtraces still name file and line, and no debug info for dependencies.
# Full debug info made every dev and test build several times larger and
# slower to link, and the agents had turned it off with
# CARGO_PROFILE_DEV_DEBUG=0 on every command. `test` inherits this profile;
# release is unchanged. Attach a debugger with `CARGO_PROFILE_DEV_DEBUG=2`.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
