# Vaultday key bindings: the single source for the key dispatcher, and later
# for the command palette and the footer tips (PR 10 fills the table from the
# design note's key table).
#
# Each binding names an action and the keys that run it under each scheme.
# Keys are strokes separated by spaces; a stroke is a key with optional
# modifiers joined by `+` (`ctrl+cmd+s`). Key names: a single character,
# `return`, `escape`, `tab`, `space`, `up`, `down`, `left`, `right`.
# An empty value leaves the action unbound under that scheme.
#
# Rules from the design note: bare `h` `j` `k` `l` are only ever movement;
# a pane jump is `g` plus the pane number (`g0` sidebar, `g1` Today,
# `g2` Inbox, `g3` side panel); `gg` and `G` stay first and last item.
version: 1
bindings:
  - action: pane.sidebar
    vim: "g 0"
    standard: ""
  - action: pane.today
    vim: "g 1"
    standard: ""
  - action: pane.inbox
    vim: "g 2"
    standard: ""
  - action: pane.side-panel
    vim: "g 3"
    standard: ""
  - action: move.down
    vim: "j"
    standard: "down"
  - action: move.up
    vim: "k"
    standard: "up"
  - action: move.left
    vim: "h"
    standard: "left"
  - action: move.right
    vim: "l"
    standard: "right"
  - action: move.first
    vim: "g g"
    standard: ""
  - action: move.last
    vim: "shift+g"
    standard: ""
  - action: open
    vim: "return"
    standard: "return"
  - action: sidebar.toggle
    vim: "ctrl+cmd+s"
    standard: "ctrl+cmd+s"
  - action: workspace.all
    vim: "cmd+0"
    standard: "cmd+0"
  - action: workspace.1
    vim: "cmd+1"
    standard: "cmd+1"
  - action: workspace.2
    vim: "cmd+2"
    standard: "cmd+2"
  - action: workspace.3
    vim: "cmd+3"
    standard: "cmd+3"
  - action: workspace.4
    vim: "cmd+4"
    standard: "cmd+4"
  - action: workspace.5
    vim: "cmd+5"
    standard: "cmd+5"
  - action: workspace.6
    vim: "cmd+6"
    standard: "cmd+6"
  - action: workspace.7
    vim: "cmd+7"
    standard: "cmd+7"
  - action: workspace.8
    vim: "cmd+8"
    standard: "cmd+8"
  - action: workspace.9
    vim: "cmd+9"
    standard: "cmd+9"
  # The palette is PR 10; until then ⌘K focuses the search field.
  - action: search.focus
    vim: "cmd+k"
    standard: "cmd+k"
  - action: task.add
    vim: "i"
    standard: "cmd+n"
  - action: task.done
    vim: "x"
    standard: "cmd+d"
  - action: task.move-up
    vim: "alt+k"
    standard: "alt+cmd+up"
  - action: task.move-down
    vim: "alt+j"
    standard: "alt+cmd+down"
  - action: plan.replan
    vim: "r"
    standard: "cmd+r"
  - action: plan.auto-schedule
    vim: "="
    standard: "shift+cmd+r"
  # The padlock of the selected task's calendar block: pin to the private
  # calendar, or unpin. `X` is the design note's key; `m` the board's.
  - action: task.pin
    vim: "m"
    standard: "cmd+l"
  - action: task.pin
    vim: "shift+x"
    standard: ""
  - action: timer.toggle
    vim: "space"
    standard: "space"
  - action: day.previous
    vim: "["
    standard: "cmd+["
  - action: day.next
    vim: "]"
    standard: "cmd+]"
  - action: day.today
    vim: "t"
    standard: "cmd+t"
  - action: dismiss
    vim: "escape"
    standard: "escape"
  # Browse, Day log and Peek (PR 9b). Browse keys act while Browse is shown.
  - action: browse.open
    vim: "g b"
    standard: "shift+cmd+b"
  - action: daylog.open
    vim: "g l"
    standard: "shift+cmd+l"
  - action: browse.query
    vim: "/"
    standard: "cmd+f"
  - action: browse.fold
    vim: "z a"
    standard: ""
  - action: browse.next-group
    vim: "shift+}"
    standard: "alt+down"
  - action: browse.previous-group
    vim: "shift+{"
    standard: "alt+up"
  - action: browse.next-match
    vim: "n"
    standard: "cmd+g"
  - action: browse.previous-match
    vim: "shift+n"
    standard: "shift+cmd+g"
  - action: peek
    vim: "shift+k"
    standard: "cmd+y"
  # The side panel's tabs by their place on the rail: Calendar, Hours,
  # Chasers, Backlog, Objectives, Day log, Claude.
  - action: side-panel.tab.1
    vim: "alt+1"
    standard: "alt+1"
  - action: side-panel.tab.2
    vim: "alt+2"
    standard: "alt+2"
  - action: side-panel.tab.3
    vim: "alt+3"
    standard: "alt+3"
  - action: side-panel.tab.4
    vim: "alt+4"
    standard: "alt+4"
  - action: side-panel.tab.5
    vim: "alt+5"
    standard: "alt+5"
  - action: side-panel.tab.6
    vim: "alt+6"
    standard: "alt+6"
  - action: side-panel.tab.7
    vim: "alt+7"
    standard: "alt+7"
