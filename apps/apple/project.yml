# XcodeGen spec for the Mac app. `xcodegen generate` in this folder writes
# Vaultday.xcodeproj (gitignored). Run `scripts/build-xcframework.sh` first:
# the VaultdayCore package needs the XCFramework and the generated Swift.
#
# Signing: Signing.xcconfig signs ad hoc ("Sign to Run Locally") with the
# reduced Signing/AdHoc.entitlements unless the gitignored
# Signing.local.xcconfig beside it names a team and an entitlements variant;
# docs/signing.md has the recipe for a free Personal Team and a paid team.
# The bundle id, App Group and Keychain access group come from
# Signing.xcconfig too, so a Personal Team signs with identifiers of its own
# (Signing.personal-team.xcconfig). CI builds with signing disabled.
name: Vaultday
options:
  bundleIdPrefix: com.eiluviann
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: false
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
packages:
  VaultdayCore:
    path: VaultdayCore
targets:
  Vaultday:
    type: application
    platform: macOS
    sources:
      - path: Vaultday
      # The single source of key bindings, read at launch by the key dispatcher.
      - path: Keymap.yaml
        buildPhase: resources
    dependencies:
      - package: VaultdayCore
    info:
      path: Vaultday/Info.plist
      properties:
        CFBundleDisplayName: Vaultday
        CFBundleName: Vaultday
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        NSCalendarsFullAccessUsageDescription: >-
          Vaultday reads the calendars you pick to plan your day around your
          events, and keeps your time boxes in a private Vaultday calendar in
          iCloud.
        NSRemindersFullAccessUsageDescription: >-
          Vaultday files the items of the Reminders lists you pick as tasks in
          your workspace, then removes them from Reminders.
        CFBundleURLTypes:
          - CFBundleURLName: com.eiluviann.vaultday
            CFBundleURLSchemes: [vaultday]
        # The App Group container holds app state, the volatile index and
        # caches, window state and (PR 11) the CLI's API token.
        VaultdayAppGroup: $(VAULTDAY_APP_GROUP)
        # The Keychain access group is the App Group itself, which the
        # application-groups entitlement grants on the data protection keychain
        # (a Personal Team build uses its keychain-access-groups entry instead).
        VaultdayKeychainAccessGroup: $(VAULTDAY_KEYCHAIN_ACCESS_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VAULTDAY_BUNDLE_IDENTIFIER)
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # One of Signing/*.entitlements, picked in Signing.xcconfig.
        CODE_SIGN_ENTITLEMENTS: $(VAULTDAY_ENTITLEMENTS)
  VaultdayTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VaultdayTests
      # The setup views take plain models, so the layout tests compile them
      # with the tokens instead of hosting the whole app.
      - path: Vaultday/Tokens.swift
      - path: Vaultday/Views/Setup
    dependencies:
      - package: VaultdayCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eiluviann.vaultday.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Vaultday:
    build:
      targets:
        Vaultday: all
        VaultdayTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # The VaultdayCore package tests run here too, so one `xcodebuild test`
      # compiles the Swift once for the app, its tests and the package tests;
      # `swift test` would compile the package a second time in its own .build.
      targets:
        - VaultdayTests
        - package: VaultdayCore/VaultdayCoreTests
