name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is the arm64 pool, the architecture the app ships on.
        # The Intel pool (macos-15-intel) was a stopgap while the arm64 runners
        # sat in the queue on 2026-10-22; GitHub is retiring Intel macOS runners.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned toolchain
        id: toolchain
        working-directory: .
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      # Pinned by commit: the action only publishes a moving `master` branch.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  node:
    name: Node
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Read the pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: pnpm install --frozen-lockfile
      # The CLI's types and tests need the napi binding: build it on Linux here.
      - run: pnpm --filter @vaultday/core-node build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Tokens.swift is generated from design/tokens.json and committed; regenerating must change nothing.
      - name: Tokens.swift matches design/tokens.json
        run: pnpm --filter @vaultday/tokens check
      # The tarballs install together and answer from outside the repo.
      - name: Pack the Node packages and smoke-test the install
        run: |
          scripts/build-node.sh
          prefix="$(mktemp -d)"
          # `./` keeps npm from reading `dist-node/x.tgz` as a GitHub `owner/repo` spec.
          npm install --prefix "$prefix" --no-audit --no-fund ./dist-node/*.tgz
          cd core/fixtures/mock-vault
          "$prefix/node_modules/.bin/vaultday" today --date 2026-10-22 | grep -q 'WEB-142'

  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apple: ${{ steps.filter.outputs.apple }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did core/, apps/, scripts/ or the workflow change?
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "apple=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" | grep -Eq '^(core/|apps/|scripts/|\.github/workflows/ci\.yml)'; then
            echo "apple=true" >> "$GITHUB_OUTPUT"
          else
            echo "apple=false" >> "$GITHUB_OUTPUT"
          fi

  apple:
    name: Apple (macos-latest)
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    # arm64 (see the Rust matrix); the XCFramework carries both arm64 and
    # x86_64 slices, so the app builds and tests on either pool.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: xcframework
      - run: brew install xcodegen
      - run: scripts/build-xcframework.sh
      - run: xcodegen generate
        working-directory: apps/apple
      # Signing disabled: the App Group and Keychain entitlements need a
      # development certificate, which CI does not have. The tests do not run
      # inside the app, so they need neither.
      # The scheme's test action holds the app tests and the VaultdayCore
      # package tests (models, Keychain store over the in-memory backend, file
      # access, calendar source, keyboard), so this one step compiles and
      # tests both; a separate `swift test` would compile the package again.
      # Bounded: a test that blocks (for example a security-scoped bookmark
      # waiting on the login keychain) fails the step, not the whole job.
      - run: >
          xcodebuild build test
          -project Vaultday.xcodeproj -scheme Vaultday
          -destination 'platform=macOS' -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          | tail -n 60
        shell: bash -o pipefail {0}
        timeout-minutes: 20
        working-directory: apps/apple
